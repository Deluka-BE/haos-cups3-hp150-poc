name: HP 150 CUPS 3 Retrofit PoC (USB test)
version: "0.1.29"
slug: cups3_hp150_poc
description: Experimental ARM64 PAPPL retrofit with capture diagnostics and real USB test printing.
url: https://github.com/Deluka-BE/haos-cups3-hp150-poc
arch:
  - aarch64
stage: experimental
startup: application
boot: manual_only
ports:
  8631/tcp: 8631
ports_description:
  8631/tcp: PAPPL HTTP interface and IPP test service
webui: http://[HOST]:[PORT:8631]/
watchdog: tcp://[HOST]:[PORT:8631]
map:
  - share:rw
options:
  log_level: info
  capture_raster_once: false
schema:
  log_level: list(fatal|error|warn|info|debug)
  capture_raster_once: bool
# Raw USB mapping for discovery and manually selected USB test queues.
usb: true
# LAN multicast requires the host network; no host D-Bus or extra capabilities.
host_network: true
