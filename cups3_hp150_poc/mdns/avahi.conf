[server]
host-name=hp150-poc
host-name-from-machine-id=no
domain-name=local
use-ipv4=yes
use-ipv6=yes
allow-point-to-point=no
use-iff-running=yes
enable-dbus=yes
disallow-other-stacks=no
[wide-area]
enable-wide-area=no
[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-resolv-conf-dns-servers=no
[reflector]
enable-reflector=no
